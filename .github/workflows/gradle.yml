name: Java CI with Gradle (Scheduled)

# События: push, pull_request И расписание
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Формат: минуты часы день_месяца месяц день_недели
    # каждую среду в 12:30 UTC
    - cron: '30 12 * * 3'
    # каждую пятницу в 22:00 UTC
    - cron: '0 22 * * 5'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: build
